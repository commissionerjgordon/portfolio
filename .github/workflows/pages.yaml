# Sample workflow for building and deploying a React + Vite site to GitHub Pages
name: Deploy React + Vite site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main
      - setup-github-pages

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Node.js dependencies
        run: npm ci
      - name: Deploy to Pages
        run: npm run deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Add summary content
        run: |
          echo "## Build Results 🚀" >> $GITHUB_STEP_SUMMARY
          echo "The build completed successfully." >> $GITHUB_STEP_SUMMARY
          echo "Check results at: https://commissionerjgordon.github.io/portfolio/" >> $GITHUB_STEP_SUMMARY
